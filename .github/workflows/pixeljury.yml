name: PixelJury Visual Audit

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare PixelJury artifacts
        run: mkdir -p artifacts/pixeljury

      - name: Run PixelJury on Cidea Lead
        run: npm run --silent audit:visual -- https://cidealeads.com/ > artifacts/pixeljury/cidea-lead.json
        env:
          PIXELJURY_PROVIDER: mock

      - name: Run PixelJury on Cidea Marketing
        run: npm run --silent audit:visual -- https://cideamarketing.com/ > artifacts/pixeljury/cidea-marketing.json
        env:
          PIXELJURY_PROVIDER: mock

      - name: Run PixelJury on Cidea Consulting
        run: npm run --silent audit:visual -- https://cideaconsulting.com/ > artifacts/pixeljury/cidea-consulting.json

      - name: Upload PixelJury results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixeljury-results
          path: artifacts/pixeljury/
        env:
          PIXELJURY_PROVIDER: mock
