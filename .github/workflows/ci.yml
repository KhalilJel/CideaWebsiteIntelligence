name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - runtime/cycle-3-agent-reach

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
      - name: Check JEV runner syntax
        run: python3 -m py_compile scripts/jev_local_runner.py
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
